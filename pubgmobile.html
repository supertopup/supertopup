<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG Mobile Top Up | Super TopUp</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182033;--muted:#69758a;--primary:#ff563d;--primary2:#ff765e;--line:#e1e6ef;--blue:#1769e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.container{width:min(1100px,94%);margin:auto}
header{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 12px #17233d0a;position:sticky;top:0;z-index:10}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900}.logo span{color:var(--primary)}
.back{color:#58657a;text-decoration:none;font-size:14px;font-weight:700}.back:hover{color:var(--primary)}
main{padding:28px 0 50px}.game-head{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;align-items:center;gap:16px;margin-bottom:18px}
.game-icon{width:62px;height:62px;border-radius:13px;overflow:hidden;background:#fff1ed;flex:none}.game-icon img{width:100%;height:100%;object-fit:cover}.game-head h1{font-size:25px;margin:0 0 4px}.game-head p{margin:0;color:var(--muted);font-size:13px}
.section{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-bottom:18px;box-shadow:0 5px 18px #1b28400a}
.section-title{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.number{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#122b62;color:#fff;font-weight:900;box-shadow:0 4px 10px #122b6230}.section-title h2{font-size:18px;margin:0;color:#173676}
.packages{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.package{border:1px solid #d9e0eb;background:#fff;border-radius:9px;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;transition:.15s;min-height:46px}.package:hover{border-color:#b8c8e4;background:#fafcff}.package.active{border:2px solid var(--blue);background:#f5f9ff;padding:11px 12px}.uc-icon{color:#f0b429}.pkg-name{font-size:13px}.pkg-price{font-weight:800;color:var(--blue);font-size:14px;white-space:nowrap}
.form{padding:20px}.label{font-size:14px;font-weight:800;display:block;margin-bottom:8px}.input{width:100%;border:1px solid #d9e0eb;border-radius:9px;padding:13px 14px;font-size:14px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769e012}.hint{font-size:12px;color:var(--muted);margin-top:7px}
.methods{padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.method{border:1px solid #d9e0eb;background:#fff;border-radius:10px;padding:12px;cursor:pointer;text-align:center;transition:.15s}.method:hover{border-color:#c1cde1}.method.active{border:2px solid var(--blue);background:#f5f9ff;padding:11px}.method img{height:48px;max-width:130px;object-fit:contain;display:block;margin:0 auto 8px}.method span{font-weight:800;font-size:14px}
.bottom{display:flex;justify-content:flex-end}.next{border:0;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:15px;font-weight:900;padding:13px 32px;cursor:pointer;box-shadow:0 8px 18px #ff563d2e}.next:hover{transform:translateY(-1px)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 0 25px}
@media(max-width:800px){.packages{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.nav{height:60px}.game-head{padding:15px}.game-icon{width:52px;height:52px}.game-head h1{font-size:20px}.packages{padding:13px;gap:8px}.package{padding:10px;font-size:12px}.package.active{padding:9px 10px}.methods{padding:13px;grid-template-columns:1fr;gap:9px}.method{display:flex;align-items:center;text-align:left;gap:14px}.method img{margin:0;width:90px;height:42px}.bottom{padding:0 13px}.next{width:100%}}
</style>
</head>
<body>
<header><div class="container nav"><div class="logo">Super<span>TopUp</span></div><a class="back" href="index.html">← All Games</a></div></header>

<main class="container">
<div class="game-head">
  <div class="game-icon"><img src="pubgmobile.jpg" alt="PUBG Mobile" onerror="this.style.display='none'"></div>
  <div><h1>PUBG Mobile</h1><p>UC Recharge</p></div>
</div>

<section class="section">
  <div class="section-title"><div class="number">1</div><h2>Select Recharge</h2></div>
  <div class="packages" id="packages"></div>
</section>

<section class="section">
  <div class="section-title"><div class="number">2</div><h2>Enter Player ID</h2></div>
  <div class="form">
    <label class="label" for="uid">PUBG Mobile Player ID</label>
    <input class="input" id="uid" type="text" inputmode="numeric" placeholder="Enter your PUBG Mobile Player ID">
    <div class="hint">আপনার PUBG Mobile Player ID সঠিকভাবে লিখুন।</div>
  </div>
</section>

<section class="section">
  <div class="section-title"><div class="number">3</div><h2>Select Payment Method</h2></div>
  <div class="methods">
    <div class="method" data-method="bKash" onclick="selectMethod(this)">
      <img src="bkash.jpg" alt="bKash" onerror="this.alt='bKash'"><span>bKash</span>
    </div>
    <div class="method" data-method="Nagad" onclick="selectMethod(this)">
      <img src="nagad.jpg" alt="Nagad" onerror="this.alt='Nagad'"><span>Nagad</span>
    </div>
    <div class="method" data-method="Rocket" onclick="selectMethod(this)">
      <img src="rocket.jpg" alt="Rocket" onerror="this.alt='Rocket'"><span>Rocket</span>
    </div>
  </div>
</section>

<div class="bottom"><button class="next" onclick="nextPayment()">Next →</button></div>
</main>

<footer>© 2026 Super TopUp — PUBG Mobile Top Up</footer>

<script>
const recharge=[
 ["Pubg 60-UC",65],["Pubg 325-UC",325],["Pubg 660-UC",650],["Pubg 1800-UC",1550],
 ["Pubg 3850-UC",2950],["Pubg 8100-UC",6750]
];

const packages=document.getElementById("packages");
let selectedPackage=null, selectedMethod=null;

packages.innerHTML=recharge.map((p,i)=>`
 <div class="package ${i===0?'active':''}" onclick="selectPackage(this,${i})">
   <span class="pkg-name">${p[0]} <span class="uc-icon">✪</span></span>
   <span class="pkg-price">৳ ${Number.isInteger(p[1])?p[1]:p[1].toFixed(1)}</span>
 </div>`).join("");
selectedPackage=recharge[0];

function selectPackage(el,index){
 document.querySelectorAll(".package").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");
 selectedPackage=recharge[index];
}
function selectMethod(el){
 document.querySelectorAll(".method").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");
 selectedMethod=el.dataset.method;
}
function nextPayment(){
 const uid=document.getElementById("uid").value.trim();
 if(!selectedPackage){alert("Please select a recharge package.");return}
 if(!uid){alert("Please enter your PUBG Mobile Player ID.");document.getElementById("uid").focus();return}
 if(!selectedMethod){alert("Please select a payment method.");return}

 const params=new URLSearchParams({
   game:"PUBG Mobile",
   package:selectedPackage[0],
   amount:selectedPackage[1],
   uid:uid,
   method:selectedMethod
 });
 window.location.href="payment.html?"+params.toString();
}
</script>
</body>
</html>
